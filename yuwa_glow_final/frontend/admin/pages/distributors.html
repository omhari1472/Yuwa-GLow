<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | YUVA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <div class="admin-grid-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">...</a></li>
                    <li><a href="distributors.html" class="active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.5,13.5A3.5,3.5 0 0,0 18,10H6A3.5,3.5 0 0,0 2.5,13.5V19H21.5V13.5M6,12H18A1.5,1.5 0 0,1 19.5,13.5V14.09L12,17.09L4.5,14.09V13.5A1.5,1.5 0 0,1 6,12M12,4.5A4,4 0 0,0 8,8.5A4,4 0 0,0 12,12.5A4,4 0 0,0 16,8.5A4,4 0 0,0 12,4.5Z" /></svg>
                        <span class="nav-label">Distributors</span>
                    </a></li>
                    <!-- ... other nav items ... -->
                </ul>
            </nav>
        </aside>

        <!-- Navbar -->
        <header class="navbar">
            <div class="navbar-left">
                <button class="sidebar-toggle">
                     <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" /></svg>
                </button>
                <h1 class="page-title">Distributor Approvals</h1>
            </div>
             <div class="navbar-right">
                <div class="admin-profile">
                     <img src="https://i.pravatar.cc/150?u=admin" alt="Admin avatar">
                     <span>Admin</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="filters-container">
                <select id="stateFilter">
                    <option value="">All States</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Karnataka">Karnataka</option>
                </select>
                <select id="districtFilter">
                    <option value="">All Districts</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Pune">Pune</option>
                    <option value="Bangalore">Bangalore</option>
                </select>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>District</th>
                            <th>State</th>
                            <th>Contact</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Pune Beauty Co.</td>
                            <td>Pune</td>
                            <td>Maharashtra</td>
                            <td>+91 9988776655</td>
                            <td><span class="status-inactive">Pending</span></td>
                            <td>
                                <button class="btn btn-sm btn-view">View</button>
                                <button class="btn btn-sm btn-success">Approve</button>
                                <button class="btn btn-sm btn-danger">Reject</button>
                            </td>
                        </tr>
                        <!-- More applicants -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Reusable Modal for Viewing Details -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modalTitle">Distributor Details</h2>
                <button class="modal-close">&times;</button>
            </header>
            <main class="modal-body">
                <p><strong>Name:</strong> Pune Beauty Co.</p>
                <p><strong>District:</strong> Pune</p>
                <p><strong>State:</strong> Maharashtra</p>
                <p><strong>Contact:</strong> +91 9988776655</p>
                <p><strong>Email:</strong> contact@punebeauty.com</p>
            </main>
            <footer class="modal-footer">
                <button class="btn btn-secondary modal-cancel">Close</button>
            </footer>
        </div>
    </div>
    
    <div id="toast-container"></div>
    <div id="confirmDialog" class="modal-overlay"></div>

    <script src="../js/admin.js"></script>
</body>
</html>
