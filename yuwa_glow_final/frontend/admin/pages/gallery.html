<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | YUWA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module">
        import GalleryAdminModule from '../js/modules/gallery-admin.js';
        import SidebarModule from '../js/modules/sidebar.js';
        
        SidebarModule.render();
        GalleryAdminModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Gallery Management</h1>
                    <p class="text-muted">Images and Videos for your showcase</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="open-add-modal">Add Media</button>
                </div>
            </header>

            <section class="admin-section">
                <div class="gallery-admin-grid" id="gallery-list">
                    <!-- Dynamic Cards -->
                </div>
            </section>
        </main>
    </div>

    <!-- Gallery Modal -->
    <div class="modal-overlay" id="gallery-modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Add Gallery Media</h2>
                <button class="close-modal" onclick="UI.modal.close('gallery-modal')">&times;</button>
            </div>
            <form id="gallery-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="form-group">
                        <label>Media Type</label>
                        <select name="type" id="g-type">
                            <option value="image">Image</option>
                            <option value="video">Video (Link)</option>
                        </select>
                    </div>
                    <div class="form-group" id="image-field">
                        <label>Upload Image</label>
                        <input type="file" name="image" accept="image/*">
                    </div>
                    <div class="form-group" id="video-field" style="display:none">
                        <label>YouTube/Vimeo URL</label>
                        <input type="url" name="media_url" placeholder="https://youtube.com/...">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="UI.modal.close('gallery-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Media</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
