<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | YUVA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module">
        import GalleryAdminModule from '../js/modules/gallery-admin.js';
        import SidebarModule from '../js/modules/sidebar.js';
        
        SidebarModule.render();
        GalleryAdminModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Gallery Management</h1>
                    <p class="text-muted">Showcase your brand's visual story</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="open-add-modal">
                        <svg class="nav-icon" style="width:18px;height:18px;margin-right:8px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                        Add Media
                    </button>
                </div>
            </header>

            <section class="admin-section">
                <div class="search-filter-bar" id="gallery-search"></div>
                <div class="gallery-admin-grid" id="gallery-list">
                    <!-- Dynamic Cards -->
                </div>
            </section>
        </main>
    </div>

    <!-- Gallery Modal -->
    <div class="modal-overlay" id="gallery-modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2 id="modal-title">Add Gallery Media</h2>
                <button class="close-modal" onclick="window.GalleryAdmin.closeModal()">&times;</button>
            </div>
            <form id="gallery-form" class="admin-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Media Title</label>
                        <input type="text" name="title" id="gallery-title" required placeholder="e.g. Summer Collection Shoot">
                    </div>
                    <div class="form-group">
                        <label>Media Type</label>
                        <div id="gallery-type-dropdown" data-name="type"></div>
                    </div>

                    <div class="form-group" id="image-field">
                        <label>Upload High-Res Image</label>
                        <div id="existing-gallery-image" class="image-preview-container" style="margin-bottom: 10px;"></div>
                        <div class="file-input-wrapper">
                            <div class="file-input-label">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                                <span>Select Media File</span>
                            </div>
                            <input type="file" name="image" accept="image/*" id="gallery-image-upload">
                        </div>
                        <div id="gallery-image-preview" class="image-preview-container"></div>
                    </div>

                    <div class="form-group" id="video-field" style="display:none">
                        <label>Source Video Link</label>
                        <div class="input-with-icon">
                            <svg class="field-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10,15L15.19,12L10,9V15M21.56,7.17C21.67,7.64 21.7,8.11 21.73,8.58C21.76,9.05 21.78,9.53 21.78,10V14C21.78,14.47 21.76,14.95 21.73,15.42C21.7,15.89 21.67,16.36 21.56,16.83C21.43,17.29 21.24,17.73 20.91,18.12C20.58,18.5 20.16,18.8 19.61,18.91C19.13,19.03 18.65,19.05 18.17,19.08C17.7,19.1 17.22,19.11 16.75,19.11H7.25C6.78,19.11 6.3,19.1 5.83,19.08C5.35,19.05 4.87,19.03 4.39,18.91C3.84,18.8 3.42,18.5 3.09,18.12C2.76,17.73 2.57,17.29 2.44,16.83C2.33,16.36 2.3,15.89 2.27,15.42C2.24,14.95 2.22,14.47 2.22,14V10C2.22,9.53 2.24,9.05 2.27,8.58C2.3,8.11 2.33,7.64 2.44,7.17C2.57,6.71 2.76,6.27 3.09,5.88C3.42,5.5 3.84,5.2 4.39,5.09C4.87,4.97 5.35,4.95 5.83,4.92C6.3,4.9 6.78,4.89 7.25,4.89H16.75C17.22,4.89 17.7,4.9 18.17,4.92C18.65,4.95 19.13,4.97 19.61,5.09C20.16,5.2 20.58,5.5 20.91,5.88C21.24,6.27 21.43,6.71 21.56,7.17Z" /></svg>
                            <input type="url" name="media_url" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <p class="input-hint">Support for YouTube and Vimeo URLs. Paste the browser address bar link.</p>
                    </div>

                    <div class="form-group">
                        <label>Visibility Status</label>
                        <div id="gallery-status-dropdown" data-name="status"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.GalleryAdmin.closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save to Gallery</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-body">
                <div style="color: #ef4444; margin-bottom: 20px;">
                    <svg style="width: 64px; height: 64px;" viewBox="0 0 24 24"><path fill="currentColor" d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" /></svg>
                </div>
                <h3>Are you sure?</h3>
                <p class="text-muted">This media item will be permanently removed.</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="UI.modal.close('delete-modal')">No, Cancel</button>
                <button class="btn btn-primary" style="background: #ef4444;" id="confirm-delete-btn">Yes, Delete It</button>
            </div>
        </div>
    </div>

</body>
</html>
