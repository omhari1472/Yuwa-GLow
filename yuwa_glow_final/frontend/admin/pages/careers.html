<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | YUWA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module">
        import CareersAdminModule from '../js/modules/careers-admin.js';
        import SidebarModule from '../js/modules/sidebar.js';
        
        SidebarModule.render();
        CareersAdminModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Opportunity Management</h1>
                    <p class="text-muted">Grow your team with premium talent</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="open-add-modal">
                        <svg class="nav-icon" style="width:18px;height:18px;margin-right:8px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                        Post New Opening
                    </button>
                </div>
            </header>

            <section class="admin-section">
                <div class="search-filter-bar" id="career-search"></div>
                <div class="card table-card">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Position</th>
                                    <th>Department</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="careers-list">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                    <div id="career-pagination"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Career Modal -->
    <div class="modal-overlay" id="career-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Job Specification</h2>
                <button class="close-modal" onclick="window.CareerAdmin.closeModal()">&times;</button>
            </div>
            <form id="career-form" class="admin-form">
                <input type="hidden" name="id" id="career-id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" name="title" id="c-title" required placeholder="e.g. Senior Beauty Consultant">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department" id="c-dept" required placeholder="e.g. Sales">
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" name="location" id="c-loc" required placeholder="e.g. Remote">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Role Description</label>
                        <textarea name="description" id="c-desc" rows="6" required placeholder="Outline responsibilities..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Availability</label>
                        <div id="career-status-dropdown" data-name="status"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.CareerAdmin.closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Specification</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-body">
                <div style="color: #ef4444; margin-bottom: 20px;">
                    <svg style="width: 64px; height: 64px;" viewBox="0 0 24 24"><path fill="currentColor" d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" /></svg>
                </div>
                <h3>Are you sure?</h3>
                <p class="text-muted">This job opening will be permanently deleted.</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="UI.modal.close('delete-modal')">No, Cancel</button>
                <button class="btn btn-primary" style="background: #ef4444;" id="confirm-delete-btn">Yes, Delete It</button>
            </div>
        </div>
    </div>

</body>
</html>
