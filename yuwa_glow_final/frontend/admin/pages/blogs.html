<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | YUWA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <style>
        .ql-container { font-size: 15px; min-height: 200px; }
        .ql-editor { min-height: 200px; }
        .ql-toolbar.ql-snow { border-radius: 10px 10px 0 0; border-color: var(--gray-border); }
        .ql-container.ql-snow { border-radius: 0 0 10px 10px; border-color: var(--gray-border); }
        #editor-container { background: white; }
    </style>
    <script type="module">
        import BlogsAdminModule from '../js/modules/blogs-admin.js';
        import SidebarModule from '../js/modules/sidebar.js';

        SidebarModule.render();
        BlogsAdminModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Editorial Management</h1>
                    <p class="text-muted">Curate and publish beauty stories</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="open-add-modal">
                        <svg class="nav-icon" style="width:18px;height:18px;margin-right:8px" viewBox="0 0 24 24"><path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z" /></svg>
                        Write New Post
                    </button>
                </div>
            </header>

            <section class="admin-section">
                <div class="search-filter-bar" id="blog-search"></div>
                <div class="card table-card">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Feature Image</th>
                                    <th>Title</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="blogs-list">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                    <div id="blog-pagination"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Blog Modal -->
    <div class="modal-overlay" id="blog-modal">
        <div class="modal-content" style="max-width: 850px;">
            <div class="modal-header">
                <h2 id="modal-title">Create Editorial</h2>
                <button class="close-modal" onclick="window.BlogAdmin.closeModal()">&times;</button>
            </div>
            <form id="blog-form" class="admin-form">
                <input type="hidden" name="id" id="blog-id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Post Title</label>
                        <input type="text" name="title" id="b-title" required placeholder="Enter a captivating headline">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Featured Image</label>
                            <div class="file-input-wrapper" style="padding: 20px;">
                                <div class="file-input-label">
                                    <svg viewBox="0 0 24 24" style="width:24px; height:24px;"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                                    <span>Upload Cover</span>
                                </div>
                                <input type="file" name="featured_image" accept="image/*" id="blog-image-upload">
                            </div>
                            <div id="blog-image-preview" class="image-preview-container"></div>
                        </div>
                        <div class="form-group">
                            <label>Publishing Status</label>
                            <div id="blog-status-dropdown" data-name="status"></div>
                            <p class="text-muted" style="font-size:11px; margin-top:10px">Drafts are only visible to administrators.</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Post Content</label>
                        <div id="editor-container"></div>
                        <input type="hidden" name="content" id="b-content">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.BlogAdmin.closeModal()">Discard</button>
                    <button type="submit" class="btn btn-primary">Save Editorial</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-body">
                <div style="color: #ef4444; margin-bottom: 20px;">
                    <svg style="width: 64px; height: 64px;" viewBox="0 0 24 24"><path fill="currentColor" d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" /></svg>
                </div>
                <h3>Are you sure?</h3>
                <p class="text-muted">This action cannot be undone.</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="UI.modal.close('delete-modal')">No, Cancel</button>
                <button class="btn btn-primary" style="background: #ef4444;" id="confirm-delete-btn">Yes, Delete It</button>
            </div>
        </div>
    </div>

</body>
</html>
