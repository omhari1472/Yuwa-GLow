<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | YUWA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module">
        import ProductsAdminModule from '../js/modules/products-admin.js';
        import SidebarModule from '../js/modules/sidebar.js';
        
        SidebarModule.render();
        ProductsAdminModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <!-- Sidebar placeholder -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Product Management</h1>
                    <p class="text-muted">Manage your premium catalog</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="open-add-modal">
                        <svg class="nav-icon" style="width:18px; height:18px; margin-right:8px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                        Add New Product
                    </button>
                </div>
            </header>

            <section class="admin-section">
                <div class="card table-card">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="product-list">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Product</h2>
                <button class="close-modal" onclick="window.ProductsAdmin.closeModal()">&times;</button>
            </div>
            <form id="product-form" class="admin-form">
                <input type="hidden" name="id" id="product-id">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" name="name" id="p-name" required placeholder="e.g. Silk Shine Shampoo">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <div id="product-category-dropdown" data-name="category_id"></div>
                        </div>
                    </div>
                    
                    <div class="form-group" id="new-category-group" style="display: none; margin-top: -10px; margin-bottom: 20px;">
                        <label>New Category Name</label>
                        <input type="text" name="new_category_name" id="new-category-name" placeholder="Enter custom category name">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Base Price ($)</label>
                            <input type="number" step="0.01" name="price" id="p-price" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <div id="product-status-dropdown" data-name="status"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" id="p-description" rows="4" required placeholder="Describe the product benefits..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Product Images</label>
                        <div class="file-input-wrapper">
                            <div class="file-input-label">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                                <span>Click or Drag to Upload Images</span>
                            </div>
                            <input type="file" name="images[]" multiple accept="image/*" id="image-upload">
                        </div>
                        <div id="image-preview" class="image-preview-container"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.ProductsAdmin.closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-body">
                <div style="color: #ef4444; margin-bottom: 20px;">
                    <svg style="width: 64px; height: 64px;" viewBox="0 0 24 24"><path fill="currentColor" d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" /></svg>
                </div>
                <h3>Are you sure?</h3>
                <p class="text-muted">This action cannot be undone.</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="UI.modal.close('delete-modal')">No, Cancel</button>
                <button class="btn btn-primary" style="background: #ef4444;" id="confirm-delete-btn">Yes, Delete It</button>
            </div>
        </div>
    </div>

</body>
</html>
