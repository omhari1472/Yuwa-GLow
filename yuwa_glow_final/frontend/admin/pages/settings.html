<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | YUWA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module">
        import SidebarModule from '../js/modules/sidebar.js';
        SidebarModule.render();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>System Settings</h1>
                    <p class="text-muted">Manage your administrative preferences</p>
                </div>
            </header>

            <section class="admin-section">
                <div class="card form-card" style="max-width: 600px;">
                    <header class="section-header" style="padding: 24px; border-bottom: 1px solid var(--gray-border);">
                        <h2>Admin Profile</h2>
                    </header>
                    <div style="padding: 24px;">
                        <form id="settings-form">
                            <div class="form-group" style="margin-bottom: 20px;">
                                <label>Administrator Name</label>
                                <input type="text" id="admin-name" value="Admin" readonly>
                            </div>
                            <div class="form-group" style="margin-bottom: 20px;">
                                <label>Email Address</label>
                                <input type="email" id="admin-email" value="admin@yuwaglow.com" readonly>
                            </div>
                            <div class="form-group" style="margin-bottom: 20px;">
                                <label>New Password</label>
                                <input type="password" placeholder="Leave blank to keep current">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Settings</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
