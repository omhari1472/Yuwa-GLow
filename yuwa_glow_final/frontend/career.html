<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - Join the YUWA GLOW Team</title>
    <meta name="description" content="Explore exciting career opportunities at YUWA GLOW. We are looking for passionate individuals to join our mission of redefining luxury beauty.">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
    <style>
        .job-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }
        .job-info {
            flex: 1;
        }
        .job-title {
            font-size: 22px;
            margin-bottom: 8px;
            color: #333;
        }
        .job-location {
            color: var(--primary-gold);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .job-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .loading-state, .error-state, .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loader {
            color: var(--primary-gold);
            font-size: 16px;
        }
        @media (max-width: 768px) {
            .job-card {
                flex-direction: column;
                text-align: center;
            }
            .job-apply {
                width: 100%;
            }
            .job-apply .cta-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/icons/logo.svg" alt="YUWA GLOW Logo">
            </a>
            <nav class="main-nav">
                <button class="nav-toggle" aria-label="toggle navigation">
                    <span class="hamburger"></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="partners.html">Business Partners</a></li>
                    <li><a href="career.html" class="active">Career</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="scroll-indicator"></div>
        <section class="page-header fade-in">
            <div class="container">
                <h1>Grow With Us</h1>
                <p>Be a part of a passionate team that's redefining the world of beauty.</p>
            </div>
        </section>

        <section class="container section-padding">
            <div class="career-listings">
                <!-- Job listings loaded dynamically -->
                <div class="loading-state" style="text-align: center; padding: 80px 20px;">
                    <div class="loader">Loading opportunities...</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 YUWA GLOW. All Rights Reserved.</p>
                <ul class="footer-links">
                    <li><a href="privacy-policy.html">Privacy Policy</a></li>
                    <li><a href="terms.html">Terms & Conditions</a></li>
                </ul>
            </div>
        </div>
    </footer>

</body>
</html>
