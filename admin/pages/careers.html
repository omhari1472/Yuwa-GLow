<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | YUWA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <div class="admin-grid-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">...</a></li>
                    <li><a href="careers.html" class="active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3L1 9l11 6 9-4.5V12h-2V10l-7 3.5-9-4.5 9-5 9 4.5V9H23V9l-11-6zM12 10a4 4 0 100 8 4 4 0 000-8zm0 6a2 2 0 110-4 2 2 0 010 4z"/></svg>
                        <span class="nav-label">Careers</span>
                    </a></li>
                    <!-- ... other nav items ... -->
                </ul>
            </nav>
        </aside>

        <!-- Navbar -->
        <header class="navbar">
            <div class="navbar-left">
                <button class="sidebar-toggle">
                     <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" /></svg>
                </button>
                <h1 class="page-title">Careers</h1>
            </div>
             <div class="navbar-right">
                <div class="admin-profile">
                     <img src="https://i.pravatar.cc/150?u=admin" alt="Admin avatar">
                     <span>Admin</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Job Openings Section -->
            <div class="page-section">
                <div class="page-header-actions">
                    <h2>Job Openings</h2>
                    <button id="createJobBtn" class="btn btn-primary">Create Job</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Job Title</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Digital Marketing Manager</td>
                                <td>Mumbai, India</td>
                                <td><span class="status-active">Open</span></td>
                                <td>
                                    <button class="btn-icon btn-edit"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.13,5.12L18.88,8.87M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25Z" /></svg></button>
                                    <button class="btn-icon btn-delete"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" /></svg></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Applications Section -->
             <div class="page-section">
                <h2>Applications</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Applicant</th>
                                <th>Applying for</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>John Doe</td>
                                <td>Digital Marketing Manager</td>
                                <td>2026-01-20</td>
                                <td>
                                    <button class="btn-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" /></svg></button>
                                    <button class="btn-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M9,16.17L4.83,12l-1.42,1.41L9,19 21,7l-1.41-1.41z"/></svg></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Reusable Modal for Job Creation -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modalTitle">Create Job</h2>
                <button class="modal-close">&times;</button>
            </header>
            <main class="modal-body">
                <form id="jobForm">
                    <div class="form-group">
                        <input type="text" id="jobTitle" required placeholder=" ">
                        <label for="jobTitle">Job Title</label>
                    </div>
                     <div class="form-group">
                        <input type="text" id="jobLocation" placeholder=" ">
                        <label for="jobLocation">Location</label>
                    </div>
                    <div class="form-group">
                        <textarea id="jobDescription" rows="6" placeholder=" "></textarea>
                        <label for="jobDescription">Description</label>
                    </div>
                </form>
            </main>
            <footer class="modal-footer">
                <button class="btn btn-secondary modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modalSave">Save Job</button>
            </footer>
        </div>
    </div>

    <div id="toast-container"></div>
    <div id="confirmDialog" class="modal-overlay">
        <div class="modal-content small">
            <header class="modal-header"><h2>Are you sure?</h2></header>
            <main class="modal-body"><p>This action cannot be undone.</p></main>
            <footer class="modal-footer">
                <button class="btn btn-secondary modal-cancel">Cancel</button>
                <button class="btn btn-danger" id="confirmDelete">Delete</button>
            </footer>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
