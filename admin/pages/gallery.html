<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | YUWA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <div class="admin-grid-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <a href="dashboard.html" class="sidebar-logo">
                    <img src="../../assets/icons/logo.svg" alt="YUWA GLOW Logo">
                </a>
            </header>
            <nav class="sidebar-nav">
                 <ul>
                    <li><a href="dashboard.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" /></svg>
                        <span class="nav-label">Dashboard</span>
                    </a></li>
                    <li><a href="products.html">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2L2,7V17L12,22L22,17V7L12,2M10.1,16.5L6.6,14.6L12,11.5L17.4,14.6L13.9,16.5L12,17.5L10.1,16.5M12,4.5L19,8.2L12,11.8L5,8.2L12,4.5Z" /></svg>
                        <span class="nav-label">Products</span>
                    </a></li>
                    <li><a href="gallery.html" class="active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21,19V5C21,3.89 20.1,3 19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5L8.5,13.5Z" /></svg>
                        <span class="nav-label">Gallery</span>
                    </a></li>
                    <!-- ... other nav items ... -->
                </ul>
            </nav>
        </aside>

        <!-- Navbar -->
        <header class="navbar">
            <div class="navbar-left">
                <button class="sidebar-toggle">
                     <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" /></svg>
                </button>
                <h1 class="page-title">Gallery & Videos</h1>
            </div>
             <div class="navbar-right">
                <div class="admin-profile">
                    <div class="admin-profile-trigger">
                        <img src="https://i.pravatar.cc/150?u=admin" alt="Admin avatar">
                        <span>Admin</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Image Gallery Section -->
            <div class="page-section">
                <div class="page-header-actions">
                    <h2>Image Gallery</h2>
                    <button id="addImageBtn" class="btn btn-primary">Add Image</button>
                </div>
                <div class="card-grid">
                    <div class="card">
                        <img src="../../assets/images/placeholder.png" alt="placeholder" class="card-img">
                        <div class="card-body">
                            <p>Image Title 1</p>
                        </div>
                        <div class="card-footer">
                            <button class="btn-icon btn-edit"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.13,5.12L18.88,8.87M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25Z" /></svg></button>
                            <button class="btn-icon btn-delete"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" /></svg></button>
                        </div>
                    </div>
                    <!-- More image cards -->
                </div>
            </div>

            <!-- Video Gallery Section -->
            <div class="page-section">
                <div class="page-header-actions">
                    <h2>Video Gallery</h2>
                    <button id="addVideoBtn" class="btn btn-primary">Add Video</button>
                </div>
                 <div class="card-grid">
                    <div class="card">
                        <img src="../../assets/images/placeholder.png" alt="placeholder" class="card-img">
                        <div class="card-body">
                            <p>Video Title 1</p>
                        </div>
                        <div class="card-footer">
                            <button class="btn-icon btn-edit"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.13,5.12L18.88,8.87M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25Z" /></svg></button>
                            <button class="btn-icon btn-delete"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" /></svg></button>
                        </div>
                    </div>
                    <!-- More video cards -->
                </div>
            </div>
        </main>
    </div>

    <!-- Reusable Modal -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modalTitle">Add Image</h2>
                <button class="modal-close">&times;</button>
            </header>
            <main class="modal-body">
                <form id="galleryForm">
                    <div class="form-group">
                        <input type="text" id="itemTitle" required placeholder=" ">
                        <label for="itemTitle">Title</label>
                    </div>
                     <div class="form-group" id="image-upload-field">
                        <label>Image File</label>
                        <input type="file" id="imageFile">
                    </div>
                    <div class="form-group" id="video-url-field">
                        <input type="text" id="videoUrl" placeholder=" ">
                        <label for="videoUrl">YouTube/Vimeo URL</label>
                    </div>
                </form>
            </main>
            <footer class="modal-footer">
                <button class="btn btn-secondary modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modalSave">Save</button>
            </footer>
        </div>
    </div>

    <div id="toast-container"></div>
    <div id="confirmDialog" class="modal-overlay">
         <div class="modal-content small">
            <header class="modal-header"><h2>Are you sure?</h2></header>
            <main class="modal-body"><p>This action cannot be undone.</p></main>
            <footer class="modal-footer">
                <button class="btn btn-secondary modal-cancel">Cancel</button>
                <button class="btn btn-danger" id="confirmDelete">Delete</button>
            </footer>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
