<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body class="admin-body">

    <div class="admin-grid-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">...</a></li>
                    <li><a href="settings.html" class="active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.96,5.03L14.5,2.46C14.46,2.19 14.21,2 13.93,2H10.09C9.81,2 9.56,2.19 9.52,2.46L9.06,5.03C8.52,5.32 7.97,5.66 7.45,6.05L4.96,5.05C4.73,4.96 4.47,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11.03C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.47,18.95 4.73,19.03 4.96,18.95L7.45,17.95C7.97,18.34 8.52,18.68 9.06,18.97L9.52,21.54C9.56,21.81 9.81,22 10.09,22H13.93C14.21,22 14.46,21.81 14.5,21.54L14.96,18.97C15.5,18.68 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" /></svg>
                        <span class="nav-label">Settings</span>
                    </a></li>
                    <!-- ... other nav items ... -->
                </ul>
            </nav>
        </aside>

        <!-- Navbar -->
        <header class="navbar">
            <div class="navbar-left">
                <button class="sidebar-toggle">
                     <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" /></svg>
                </button>
                <h1 class="page-title">Settings</h1>
            </div>
             <div class="navbar-right">
                <div class="admin-profile">
                     <img src="https://i.pravatar.cc/150?u=admin" alt="Admin avatar">
                     <span>Admin</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-section">
                <h2>Company Details</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <input type="text" id="companyName" value="JANBOL BUSINESS SOLUTION PRIVATE LIMITED" placeholder=" ">
                        <label for="companyName">Company Name</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="brandName" value="YUWA GLOW" placeholder=" ">
                        <label for="brandName">Brand Name</label>
                    </div>
                     <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <div class="page-section">
                <h2>Contact Information</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <input type="email" id="contactEmail" value="care@yuwaglow.com" placeholder=" ">
                        <label for="contactEmail">Email</label>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="contactPhone" value="+91 12345 67890" placeholder=" ">
                        <label for="contactPhone">Phone</label>
                    </div>
                     <div class="form-group">
                        <textarea id="contactAddress" rows="3" placeholder=" ">123 Silk Avenue, Beauty City, 400001, India</textarea>
                        <label for="contactAddress">Address</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <div class="page-section">
                <h2>Social Media Links</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <input type="url" id="facebookUrl" value="https://facebook.com/yuwaglow" placeholder=" ">
                        <label for="facebookUrl">Facebook URL</label>
                    </div>
                    <div class="form-group">
                        <input type="url" id="instagramUrl" value="https://instagram.com/yuwaglow" placeholder=" ">
                        <label for="instagramUrl">Instagram URL</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <div class="page-section">
                <h2>Change Password</h2>
                <form class="settings-form">
                    <div class="form-group">
                        <input type="password" id="oldPassword" placeholder=" ">
                        <label for="oldPassword">Old Password</label>
                    </div>
                    <div class="form-group">
                        <input type="password" id="newPassword" placeholder=" ">
                        <label for="newPassword">New Password</label>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirmNewPassword" placeholder=" ">
                        <label for="confirmNewPassword">Confirm New Password</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Change Password</button>
                </form>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <div id="confirmDialog" class="modal-overlay"></div>

    <script src="../js/admin.js"></script>
</body>
</html>
