<svg
  width="950"
  height="240"
  viewBox="0 0 950 240"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Rich Luxurious Gold Gradient -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="20%" stop-color="#C9A227"/>
      <stop offset="40%" stop-color="#E6C35C"/>
      <stop offset="50%" stop-color="#F7E7A0"/>
      <stop offset="60%" stop-color="#E6C35C"/>
      <stop offset="80%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>

    <!-- Deep Bronze Gold -->
    <linearGradient id="bronzeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#704214"/>
      <stop offset="50%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#704214"/>
    </linearGradient>

    <!-- Bright Accent Gold -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Elegant drop shadow -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#8B6914" flood-opacity="0.4"/>
    </filter>

    <!-- Bright glow for Glow text -->
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background accent swoosh -->
  <path
    d="M 100 115 Q 350 55, 475 115 T 850 115"
    stroke="url(#richGold)"
    stroke-width="2"
    fill="none"
    opacity="0.3"
  />

  <!-- YUVA in bold elegant style -->
  <text
    x="305"
    y="115"
    text-anchor="end"
    font-size="88"
    font-weight="700"
    font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif"
    fill="url(#bronzeGold)"
    letter-spacing="8"
    filter="url(#goldShadow)"
  >YUVA</text>

  <!-- GLOW in stylish script-inspired style -->
  <text
    x="320"
    y="115"
    text-anchor="start"
    font-size="88"
    font-weight="400"
    font-style="italic"
    font-family="'Playfair Display', 'Baskerville', Georgia, serif"
    fill="url(#richGold)"
    letter-spacing="12"
    filter="url(#goldGlow)"
  >Glow</text>

  <!-- Sparkle accent on the 'G' -->
  <g transform="translate(328, 45)">
    <line x1="0" y1="0" x2="12" y2="12" stroke="#FFD700" stroke-width="2"/>
    <line x1="12" y1="0" x2="0" y2="12" stroke="#FFD700" stroke-width="2"/>
    <line x1="6" y1="-4" x2="6" y2="16" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="-4" y1="6" x2="16" y2="6" stroke="#FFD700" stroke-width="1.5"/>
  </g>

  <!-- Second sparkle -->
  <g transform="translate(605, 40) scale(0.7)">
    <line x1="0" y1="0" x2="10" y2="10" stroke="#E6C35C" stroke-width="1.8"/>
    <line x1="10" y1="0" x2="0" y2="10" stroke="#E6C35C" stroke-width="1.8"/>
    <line x1="5" y1="-3" x2="5" y2="13" stroke="#E6C35C" stroke-width="1.2"/>
    <line x1="-3" y1="5" x2="13" y2="5" stroke="#E6C35C" stroke-width="1.2"/>
  </g>

  <!-- PROFESSIONAL CO. starting from G -->
  <text
    x="320"
    y="165"
    text-anchor="start"
    font-size="24"
    font-weight="500"
    font-family="'Josefin Sans', 'Futura', 'Avenir', sans-serif"
    fill="url(#bronzeGold)"
    letter-spacing="16"
  >PROFESSIONAL CO.</text>

  <!-- Underline accent -->
  <line
    x1="320"
    y1="182"
    x2="640"
    y2="182"
    stroke="url(#accentGold)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Decorative diamond -->
  <polygon
    points="650,182 658,190 650,198 642,190"
    fill="url(#richGold)"
  />

  <!-- Elegant corner flourish left -->
  <path
    d="M 160 75 Q 175 95, 160 115"
    stroke="url(#richGold)"
    stroke-width="1.5"
    fill="none"
    opacity="0.5"
  />

  <!-- Elegant corner flourish right -->
  <path
    d="M 690 75 Q 675 95, 690 115"
    stroke="url(#richGold)"
    stroke-width="1.5"
    fill="none"
    opacity="0.5"
  />
</svg>
