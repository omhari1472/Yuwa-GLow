<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | YUVA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module">
        import DashboardModule from '../js/modules/dashboard.js';
        import SidebarModule from '../js/modules/sidebar.js';
        
        SidebarModule.render();
        DashboardModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <!-- Sidebar placeholder -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Admin Dashboard</h1>
                    <p class="text-muted">Welcome back, Administrator</p>
                </div>
            </header>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-icon products-icon">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12,2L2,7V17L12,22L22,17V7L12,2M10.1,16.5L6.6,14.6L12,11.5L17.4,14.6L13.9,16.5L12,17.5L10.1,16.5M12,4.5L19,8.2L12,11.8L5,8.2L12,4.5Z" /></svg>
                    </div>
                    <div class="stat-info">
                        <h3 id="total-products">--</h3>
                        <p>Total Products</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blogs-icon">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4,5v14h16V5H4M4,3h16c1.1,0 2,0.9 2,2v14c0,1.1-0.9,2-2,2H4c-1.1,0-2-0.9-2-2V5C2,3.9 2.9,3 4,3z M9,7h6v2H9V7z M9,11h6v2H9V11z M7,15h10v2H7V15z" /></svg>
                    </div>
                    <div class="stat-info">
                        <h3 id="total-blogs">--</h3>
                        <p>Total Blogs</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon apps-icon">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12,3L1 9l11 6 9-4.5V12h-2V10l-7 3.5-9-4.5 9-5 9 4.5V9H23V9l-11-6z"/></svg>
                    </div>
                    <div class="stat-info">
                        <h3 id="pending-apps">--</h3>
                        <p>Pending Applications</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon partners-icon">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18 11c1.49 0 2.87.54 3.94 1.5C23.01 13.57 23.5 15 23.5 16.5A3.5 3.5 0 0120 20H4a3.5 3.5 0 01-3.5-3.5C.5 15 .99 13.57 2.06 12.5S5.51 11 7 11h11M7 9a5 5 0 015-5 5 5 0 015 5v1.28C16.39 10.1 15.74 10 15 10c-2.3 0-4.32 1.05-5.69 2.69C8.36 12.04 7.69 11.55 7 11.28V9z" /></svg>
                    </div>
                    <div class="stat-info">
                        <h3 id="active-partners">--</h3>
                        <p>Active Partners</p>
                    </div>
                </div>
            </div>

            <div class="content-grid">
                <section class="data-section">
                    <header class="section-header">
                        <h2>Recent Enquiries</h2>
                        <a href="enquiries.html" class="btn btn-text">View All</a>
                    </header>
                    <div class="card table-card">
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Sender</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-enquiries">
                                    <!-- Dynamic Rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

</body>
</html>
