<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | YUVA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .gallery-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .gallery-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-border);
        }
        .gallery-section-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gallery-section-title h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark-text);
            margin: 0;
        }
        .gallery-section-title .section-icon {
            width: 40px;
            height: 40px;
            background: var(--warm-cream);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-gold);
        }
        .gallery-section-title .section-icon svg {
            width: 22px;
            height: 22px;
        }
        .section-count {
            font-size: 13px;
            color: #6b7280;
            margin-left: 8px;
        }
    
        .transformation-admin-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border: 1px solid var(--gray-border);
            transition: 0.2s;
        }
        .transformation-admin-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .transformation-images {
            display: grid;
            grid-template-columns: 1fr 20px 1fr;
            align-items: center;
            background: #f8f9fa;
            padding: 8px;
            gap: 4px;
        }
        .transformation-images img {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
        }
        .transformation-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-gold);
        }
        .transformation-arrow svg {
            width: 16px;
            height: 16px;
        }
        .transformation-info {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .transformation-info .user-info {
            flex: 1;
            min-width: 0;
        }
        .transformation-info .user-info h4 {
            font-size: 12px;
            margin-bottom: 2px;
            color: var(--dark-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .transformation-info .user-info p {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .transformation-info > div:last-child {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .transformation-info .btn-icon {
            padding: 5px;
        }
        .transformation-info .btn-icon svg {
            width: 14px;
            height: 14px;
        }
        .dual-upload-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .dual-upload-row .file-input-wrapper {
            padding: 20px;
        }
        .dual-upload-row .preview-item {
            width: 100%;
            height: auto;
            max-height: 150px;
        }
        .empty-section {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
            grid-column: 1 / -1;
        }
        .empty-section svg {
            width: 48px;
            height: 48px;
            color: #d1d5db;
            margin-bottom: 12px;
        }
        .empty-section p {
            margin-bottom: 16px;
        }

        /* Photos and Videos grid adjustments */
        #photos-list, #videos-list {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
    </style>
    <script type="module">
        import GalleryAdminModule from '../js/modules/gallery-admin.js';
        import SidebarModule from '../js/modules/sidebar.js';

        SidebarModule.render();
        GalleryAdminModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Gallery Management</h1>
                    <p class="text-muted">Showcase your brand's visual story</p>
                </div>
            </header>

            <!-- Photos Section -->
            <div class="gallery-section">
                <div class="gallery-section-header">
                    <div class="gallery-section-title">
                        <div class="section-icon">
                            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21,19V5C21,3.89 20.1,3 19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5L8.5,13.5Z" /></svg>
                        </div>
                        <h2>Photos <span class="section-count" id="photos-count"></span></h2>
                    </div>
                    <button class="btn btn-primary" id="add-photo-btn">
                        <svg class="nav-icon" style="width:18px;height:18px;margin-right:8px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                        Add Photo
                    </button>
                </div>
                <div class="gallery-admin-grid" id="photos-list">
                    <!-- Dynamic Photos -->
                </div>
            </div>

            <!-- Videos Section -->
            <div class="gallery-section">
                <div class="gallery-section-header">
                    <div class="gallery-section-title">
                        <div class="section-icon">
                            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10,15L15.19,12L10,9V15M21.56,7.17C21.69,7.64 21.78,8.27 21.84,9.07C21.91,9.87 21.94,10.56 21.94,11.16L22,12C22,14.19 21.84,15.8 21.56,16.83C21.31,17.73 20.73,18.31 19.83,18.56C19.36,18.69 18.5,18.78 17.18,18.84C15.88,18.91 14.69,18.94 13.59,18.94L12,19C7.81,19 5.2,18.84 4.17,18.56C3.27,18.31 2.69,17.73 2.44,16.83C2.31,16.36 2.22,15.73 2.16,14.93C2.09,14.13 2.06,13.44 2.06,12.84L2,12C2,9.81 2.16,8.2 2.44,7.17C2.69,6.27 3.27,5.69 4.17,5.44C4.64,5.31 5.5,5.22 6.82,5.16C8.12,5.09 9.31,5.06 10.41,5.06L12,5C16.19,5 18.8,5.16 19.83,5.44C20.73,5.69 21.31,6.27 21.56,7.17Z" /></svg>
                        </div>
                        <h2>Videos <span class="section-count" id="videos-count"></span></h2>
                    </div>
                    <button class="btn btn-primary" id="add-video-btn">
                        <svg class="nav-icon" style="width:18px;height:18px;margin-right:8px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                        Add Video
                    </button>
                </div>
                <div class="gallery-admin-grid" id="videos-list">
                    <!-- Dynamic Videos -->
                </div>
            </div>

            <!-- Before/After Transformations Section -->
            <div class="gallery-section">
                <div class="gallery-section-header">
                    <div class="gallery-section-title">
                        <div class="section-icon">
                            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,3H5C3.89,3 3,3.89 3,5V19C3,20.11 3.89,21 5,21H19C20.11,21 21,20.11 21,19V5C21,3.89 20.11,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" /></svg>
                        </div>
                        <h2>Before/After Transformations <span class="section-count" id="transformations-count"></span></h2>
                    </div>
                    <button class="btn btn-primary" id="add-transformation-btn">
                        <svg class="nav-icon" style="width:18px;height:18px;margin-right:8px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                        Add Transformation
                    </button>
                </div>
                <div class="gallery-admin-grid" id="transformations-list">
                    <!-- Dynamic Transformations -->
                </div>
            </div>
        </main>
    </div>

    <!-- Photo Modal -->
    <div class="modal-overlay" id="photo-modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2 id="photo-modal-title">Add Photo</h2>
                <button class="close-modal" onclick="window.GalleryAdmin.closePhotoModal()">&times;</button>
            </div>
            <form id="photo-form" class="admin-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Photo Title</label>
                        <input type="text" name="title" id="photo-title" required placeholder="e.g. Summer Collection Shoot">
                    </div>
                    <input type="hidden" name="type" value="image">

                    <div class="form-group">
                        <label>Upload High-Res Image</label>
                        <div id="existing-photo-image" class="image-preview-container" style="margin-bottom: 10px;"></div>
                        <div class="file-input-wrapper">
                            <div class="file-input-label">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                                <span>Select Image File</span>
                            </div>
                            <input type="file" name="image" accept="image/*" id="photo-image-upload">
                        </div>
                        <div id="photo-image-preview" class="image-preview-container"></div>
                    </div>

                    <div class="form-group">
                        <label>Visibility Status</label>
                        <div id="photo-status-dropdown" data-name="status"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.GalleryAdmin.closePhotoModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Photo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Video Modal -->
    <div class="modal-overlay" id="video-modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2 id="video-modal-title">Add Video</h2>
                <button class="close-modal" onclick="window.GalleryAdmin.closeVideoModal()">&times;</button>
            </div>
            <form id="video-form" class="admin-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Video Title</label>
                        <input type="text" name="title" id="video-title" required placeholder="e.g. Product Tutorial">
                    </div>
                    <input type="hidden" name="type" value="video">

                    <div class="form-group">
                        <label>Video URL</label>
                        <div class="input-with-icon">
                            <svg class="field-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10,15L15.19,12L10,9V15M21.56,7.17C21.69,7.64 21.78,8.27 21.84,9.07C21.91,9.87 21.94,10.56 21.94,11.16L22,12C22,14.19 21.84,15.8 21.56,16.83C21.31,17.73 20.73,18.31 19.83,18.56C19.36,18.69 18.5,18.78 17.18,18.84C15.88,18.91 14.69,18.94 13.59,18.94L12,19C7.81,19 5.2,18.84 4.17,18.56C3.27,18.31 2.69,17.73 2.44,16.83C2.31,16.36 2.22,15.73 2.16,14.93C2.09,14.13 2.06,13.44 2.06,12.84L2,12C2,9.81 2.16,8.2 2.44,7.17C2.69,6.27 3.27,5.69 4.17,5.44C4.64,5.31 5.5,5.22 6.82,5.16C8.12,5.09 9.31,5.06 10.41,5.06L12,5C16.19,5 18.8,5.16 19.83,5.44C20.73,5.69 21.31,6.27 21.56,7.17Z" /></svg>
                            <input type="url" name="media_url" id="video-url" required placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <p class="input-hint">Support for YouTube and Vimeo URLs</p>
                    </div>

                    <div class="form-group">
                        <label>Visibility Status</label>
                        <div id="video-status-dropdown" data-name="status"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.GalleryAdmin.closeVideoModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Video</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Transformation Modal -->
    <div class="modal-overlay" id="transformation-modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="transformation-modal-title">Add Transformation</h2>
                <button class="close-modal" onclick="window.GalleryAdmin.closeTransformationModal()">&times;</button>
            </div>
            <form id="transformation-form" class="admin-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Transformation Title</label>
                        <input type="text" name="title" id="transformation-title" required placeholder="e.g. Frizz to Fabulous">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" id="transformation-description" rows="2" placeholder="Brief description of the treatment"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Before & After Images</label>
                        <div id="existing-transformation-images" class="image-preview-container" style="margin-bottom: 10px;"></div>
                        <div class="dual-upload-row">
                            <div>
                                <div class="file-input-wrapper">
                                    <div class="file-input-label">
                                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                                        <span>Before Image</span>
                                    </div>
                                    <input type="file" name="before_image" accept="image/*" id="before-image-upload">
                                </div>
                                <div id="before-image-preview" class="image-preview-container"></div>
                            </div>
                            <div>
                                <div class="file-input-wrapper">
                                    <div class="file-input-label">
                                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                                        <span>After Image</span>
                                    </div>
                                    <input type="file" name="after_image" accept="image/*" id="after-image-upload">
                                </div>
                                <div id="after-image-preview" class="image-preview-container"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Visibility Status</label>
                        <div id="transformation-status-dropdown" data-name="status"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="window.GalleryAdmin.closeTransformationModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Transformation</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-body">
                <div style="color: #ef4444; margin-bottom: 20px;">
                    <svg style="width: 64px; height: 64px;" viewBox="0 0 24 24"><path fill="currentColor" d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" /></svg>
                </div>
                <h3>Are you sure?</h3>
                <p class="text-muted">This item will be permanently removed.</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="UI.modal.close('delete-modal')">No, Cancel</button>
                <button class="btn btn-primary" style="background: #ef4444;" id="confirm-delete-btn">Yes, Delete It</button>
            </div>
        </div>
    </div>

</body>
</html>
