<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | YUVA GLOW Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module">
        import SidebarModule from '../js/modules/sidebar.js';
        import SettingsAdminModule from '../js/modules/settings-admin.js';
        
        SidebarModule.render();
        SettingsAdminModule.init();
    </script>
</head>
<body>

    <div class="admin-grid-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>System Settings</h1>
                    <p class="text-muted">Manage your administrative preferences</p>
                </div>
            </header>

            <section class="admin-section" style="max-width: 800px;">
                <!-- Profile Card -->
                <div class="card mb-6">
                    <header class="card-header" style="padding: 24px; border-bottom: 1px solid var(--gray-border);">
                        <h2 style="font-size: 18px; font-weight: 600;">Admin Profile</h2>
                    </header>
                    <div style="padding: 24px;">
                        <form id="profile-form" class="admin-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Administrator Name</label>
                                    <div class="input-with-icon">
                                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                            <circle cx="12" cy="7" r="4"></circle>
                                        </svg>
                                        <input type="text" id="admin-name" value="Admin" readonly style="background-color: #f9fafb;">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Email Address</label>
                                    <div class="input-with-icon">
                                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                            <polyline points="22,6 12,13 2,6"></polyline>
                                        </svg>
                                        <input type="email" id="admin-email" value="admin@YUVAglow.com" readonly style="background-color: #f9fafb;">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Security Card -->
                <div class="card">
                    <header class="card-header" style="padding: 24px; border-bottom: 1px solid var(--gray-border);">
                        <h2 style="font-size: 18px; font-weight: 600;">Security Settings</h2>
                    </header>
                    <div style="padding: 24px;">
                        <form id="password-form" class="admin-form">
                            <div class="form-group">
                                <label>Current Password</label>
                                <div class="input-with-icon">
                                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                    <input type="password" id="current_password" placeholder="Enter current password">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>New Password</label>
                                    <div class="input-with-icon">
                                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                        </svg>
                                        <input type="password" id="new_password" placeholder="Enter new password">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Confirm New Password</label>
                                    <div class="input-with-icon">
                                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                        </svg>
                                        <input type="password" id="new_password_confirmation" placeholder="Confirm new password">
                                    </div>
                                </div>
                            </div>
                            <div style="margin-top: 10px; display: flex; justify-content: flex-end;">
                                <button type="submit" class="btn btn-primary">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
