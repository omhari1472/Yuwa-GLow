<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect with YUVA GLOW</title>
    <meta name="description" content="Connect with YUVA GLOW on social media and visit our website.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--warm-cream);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .connect-card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--soft-gold);
        }
        .logo-area {
            margin-bottom: 30px;
        }
        .logo-area img {
            height: 80px;
            width: auto;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid var(--primary-gold);
            color: var(--dark-text);
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            font-weight: 500;
            font-family: var(--font-secondary);
            gap: 10px;
        }
        .link-btn:hover {
            background: var(--primary-gold);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(195, 134, 54, 0.2);
        }
        .link-btn svg {
            width: 24px;
            height: 24px;
        }
        .link-btn.main-site {
            background: var(--dark-text);
            color: #fff;
            border-color: var(--dark-text);
            margin-top: 10px;
        }
        .link-btn.main-site:hover {
            background: var(--primary-gold);
            border-color: var(--primary-gold);
        }
        .qr-footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

</html>
