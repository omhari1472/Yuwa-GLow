<svg
  width="900"
  height="250"
  viewBox="0 0 900 250"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Gold Gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b07a3a"/>
      <stop offset="50%" stop-color="#e6c27a"/>
      <stop offset="100%" stop-color="#b07a3a"/>
    </linearGradient>
  </defs>

  <!-- Main Brand Name -->
  <text
    x="50%"
    y="110"
    text-anchor="middle"
    font-size="96"
    font-weight="700"
    font-family="Georgia, 'Times New Roman', serif"
    fill="url(#goldGradient)"
    letter-spacing="4"
  >
    YUVA GLOW
  </text>

  <!-- Tagline -->
  <text
    x="50%"
    y="170"
    text-anchor="middle"
    font-size="28"
    font-weight="400"
    font-family="Arial, Helvetica, sans-serif"
    fill="#444"
    letter-spacing="6"
  >
    PROFESSIONAL COMPANY
  </text>
</svg>
