<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - Join the YUVA GLOW Team</title>
    <meta name="description" content="Explore exciting career opportunities at YUVA GLOW. We are looking for passionate individuals to join our mission of redefining luxury beauty.">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/forms.js"></script>
    <script type="module" src="js/main.js"></script>
    <style>
        .job-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }
        .job-info {
            flex: 1;
        }
        .job-title {
            font-size: 22px;
            margin-bottom: 8px;
            color: #333;
        }
        .job-location {
            color: var(--primary-gold);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .job-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .loading-state, .error-state, .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loader {
            color: var(--primary-gold);
            font-size: 16px;
        }
        @media (max-width: 768px) {
            .job-card {
                flex-direction: column;
                text-align: center;
            }
            .job-apply {
                width: 100%;
            }
            .job-apply .cta-button {
                width: 100%;
            }
        }
    </style>
</head>
