<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | YUVA GLOW</title>
    <meta name="description" content="View detailed product information from YUVA GLOW's premium skincare collection.">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
    <style>
        .product-category {
            color: var(--primary-gold);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: inline-block;
            background: rgba(195, 134, 54, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
        }
        .loading-state, .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        .loader {
            color: var(--primary-gold);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/icons/logo.svg" alt="YUVA GLOW Logo">
            </a>
            <nav class="main-nav">
                <button class="nav-toggle" aria-label="toggle navigation">
                    <span class="hamburger"></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="products.html" class="active">Products</a></li>
                    <li><a href="partners.html">Business Partners</a></li>
                    <li><a href="career.html">Career</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="section-padding">
        <div class="scroll-indicator"></div>
        <div class="container">
            <div class="product-detail-layout">
                <!-- Content loaded dynamically -->
                <div class="loading-state" style="grid-column: 1 / -1; text-align: center; padding: 100px 0;">
                    <div class="loader">Loading product details...</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 YUVA GLOW. All Rights Reserved.</p>
                <ul class="footer-links">
                    <li><a href="privacy-policy.html">Privacy Policy</a></li>
                    <li><a href="terms.html">Terms & Conditions</a></li>
                </ul>
            </div>
        </div>
    </footer>

</body>
</html>
